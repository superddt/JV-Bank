name: Market Data Daily Sync

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00 (台灣時間上午 10:00) 執行一次
  workflow_dispatch:      # 允許你手動在 GitHub 頁面上點擊執行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 賦予寫入權限，讓 Bot 可以 push 資料
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: python update_data.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "MarketBot"
          git config --global user.email "bot@github.com"
          git add data/market_data.json
          # 只有在檔案有變動時才 commit，避免重複紀錄
          git diff --quiet && git diff --staged --quiet || (git commit -m "📈 自動更新市場數據: $(date +'%Y-%m-%d')" && git push)